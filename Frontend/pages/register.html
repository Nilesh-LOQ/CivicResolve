<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>CivicResolve | Report an issue</title>
</head>
<body>
    <h1>Welcome to civic resolve</h1>
    <P>making our city better , one report at a time</P>
    <form>
        <label for="username">name</label>
        <input type="text" id="username" name="full_name" placeholder="your name" minlength="3" maxlength="20" required><br><br>
        <label for="email">email</label>
        <input type="email" id="email" name="email_address" placeholder="your email" required><br><br>
        <label for="password">password</label>
        <input type="password" id="password" name="user_password" placeholder="your password" required><br><br>
        <label for="confirm_pass">confirm password</label>
        <input type="password" id="confirm_pass" name="user_confirm_pass" placeholder="confirm password" required><br><br>
        <button type="submit">Register</button>

    </form>
</body> 
</html>
